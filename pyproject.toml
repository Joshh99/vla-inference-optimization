[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-inference-optimization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "lerobot[smolvla]==0.5.1",
  "numpy>=1.26",
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
